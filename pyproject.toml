[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "practical-data-structures-python"
version = "0.1.0"
description = "Small Python examples for practicing data structures."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Saina Kakkar" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
